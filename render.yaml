# Render Blueprint: one free web service serving the client and the Socket.IO game server on one URL.
# Match state is in memory, so keep exactly one instance.
services:
  - type: web
    name: five-nights-bay-area
    runtime: node
    plan: free
    region: oregon
    numInstances: 1
    # NODE_ENV stays unset during the build so devDependencies (vite, tailwind, typescript) are installed;
    # `npm start` sets NODE_ENV=production for the server process.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: CAMERA_MODE
        value: auto
      # Render's load balancer reaches the service from its private network; trusting it lets per-player
      # rate limits use the real client address from X-Forwarded-For. Peers outside this range are never trusted.
      - key: TRUST_PROXY
        value: 10.0.0.0/8
